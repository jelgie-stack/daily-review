# Daily Review config: the only file you edit to point the review at your warehouse.
#
# The engine builds ONE query from this file:
#
#   SELECT CAST(<date> AS DATE) AS d, <unit> AS unit, <channel> AS channel, [<extra dims>...]
#          <revenue> AS revenue, <orders> AS orders, [<optional measures>...]
#   FROM   <source>
#   WHERE  CAST(<date> AS DATE) BETWEEN DATE 'yyyy-mm-dd' AND DATE 'yyyy-mm-dd'
#   GROUP  BY 1, 2, 3 [, ...]
#
# Every expression below is pasted into that query verbatim, so write them in your
# warehouse's SQL. Measures must be aggregate expressions (SUM, COUNT, COUNT DISTINCT).
# Everything else (baselines, z-scores, decomposition, persistence) happens in Python.

business:
  name: Acme Provisions          # appears in the brief header
  currency: USD
  timezone: America/Denver

profile: generic                 # generic | restaurant | ecommerce (see profiles/)

warehouse:
  adapter: duckdb                # duckdb | bigquery | snowflake | postgres | redshift
  # Adapter-specific connection settings. Credentials never go here: adapters read them
  # from the environment (GOOGLE_APPLICATION_CREDENTIALS, SNOWFLAKE_PASSWORD, PGPASSWORD...).
  duckdb:
    path: sample/sample.duckdb
  # bigquery:
  #   project: my-gcp-project
  # snowflake:
  #   account: xy12345.us-east-1
  #   user: REVIEW_BOT
  #   warehouse: ANALYTICS_WH
  #   database: ANALYTICS
  #   schema: MARTS
  # postgres:
  #   dsn: postgresql://review_bot@db.internal:5432/analytics

source: orders                   # a table, a view, or a parenthesised subquery

columns:
  date: order_ts                 # anything CAST-able to DATE
  unit: unit_id                  # the thing you compare against itself: store, market, product line
  channel: channel               # how the order arrived; set to a literal like "'all'" if you have none
  hour: EXTRACT(HOUR FROM order_ts)   # only needed by profiles that derive dayparts

measures:
  revenue: SUM(net_sales)
  orders: COUNT(DISTINCT order_id)
  new_customers: SUM(CASE WHEN customer_order_number = 1 THEN 1 ELSE 0 END)
  # sessions: SUM(sessions)      # ecommerce profile; only if your source has traffic

filters:
  # Optional predicates. Each is ANDed into the WHERE clause of the core query.
  core:
    - "order_status = 'completed'"
  # Named segments referenced by profiles (e.g. restaurant.segments.exclude_from_core).
  # is_catering: "is_catering = TRUE"

# Override any profile rule here.
rules:
  min_signal_revenue: 500        # the top line must move by at least this much to be flagged
  unit_move_abs: 150             # a unit must move by at least this much; ~15% of a typical unit-day

# Holidays. The default calendar is profiles/holidays.yaml (US). Add your own here in the same
# shape, or point holiday_calendar at another file.
# holiday_calendar: profiles/holidays.yaml
holidays:
  - {name: Company Anniversary Sale, rule: fixed, month: 3, day: 15}

# Context: things that explain a day but are not in the sales data. Internal events (a promo
# ending, an outage, reduced hours) are the valuable ones, and someone has to write them down.
# Rows here, in a CSV, or both. scope = all | <unit id> | channel:<name>.
context:
  file: sample/context.csv
  rows:
    - {date: 2026-09-30, scope: all, kind: pricing, note: "Menu prices +3% across the board"}

# Weather (opt-in; skip it for a business that is not weather-sensitive). One row per unit per
# notable-weather day. provider: open-meteo (free, no key) needs a lat/lon per unit; provider:
# file reads a CSV so the sample runs offline.
weather:
  enabled: true
  provider: file
  file: sample/weather.csv
  units: imperial                # imperial | metric (display only)
  # provider: open-meteo
  # locations_file: sample/locations.csv
  # thresholds: {rain_mm: 5, snow_cm: 1, heat_c: 35, cold_c: -15, wind_kmh: 60}

output:
  dir: out                       # where briefs and JSON land
  brief_format: markdown
